<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="ls-packages-en-t ls-packages-en-d">
<title id="ls-packages-en-t">An import is a path: how Go finds room/</title>
<desc id="ls-packages-en-d">1. On disk there are main.go and room/find.go. A folder is not yet an import path. 2. package room groups the code, but nothing says where example.com/demo lives. 3. go.mod maps example.com/demo to demo/; adding /room gives demo/room/. 4. The import in main resolves to the local room package and calls room.Find(42).</desc>
