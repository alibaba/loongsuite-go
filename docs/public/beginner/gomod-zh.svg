<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="ls-gomod-zh-t ls-gomod-zh-d">
<title id="ls-gomod-zh-t">同一份 go.mod：我是谁，我需要谁</title>
<desc id="ls-gomod-zh-d">1. module 行声明当前模块的路径，也就是“我是谁”。 2. 源码要使用另一个模块的代码，这才形成依赖。 3. require 把外部依赖写进同一份 go.mod。 4. require 只是声明，不是函数调用；运行时才执行源码里的调用。</desc>
