<title id="ls-observe-zh-t">给 FindRoom 加上前后观察动作</title>
<desc id="ls-observe-zh-d">1. 最初只能得到返回值 room-42，没有耗时记录。 2. 调用前用 time.Now() 记下开始时间，再执行一次原函数。 3. 函数返回后计算 time.Since(start)，输出耗时。 4. 工具要把类似的前后动作，自动接到很多目标函数上。</desc>
