<title id="ls-hooks-en-t">The rule finds the place; hooks do the work</title>
<desc id="ls-hooks-en-d">1. The rule finds the RoundTrip method used in this page. 2. When the target is called, the OnEnter hook runs first. 3. Then the original function body runs. 4. On return, the OnExit hook runs. This example observes without changing the result.</desc>
