<title id="ls-observe-en-t">Adding observation around FindRoom</title>
<desc id="ls-observe-en-d">1. At first you only get the return value room-42, with no timing. 2. Record the start time with time.Now(), then run the original function once. 3. After it returns, compute time.Since(start) and print the duration. 4. The tool wires the same before/after actions into many target functions.</desc>
