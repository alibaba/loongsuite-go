<title id="ls-deps-en-t">One more call: why the build breaks</title>
<desc id="ls-deps-en-d">1. At first only demo&#39;s own code is needed; it prints room-42. 2. FindRoom now calls observer.Record, but go.mod does not declare that dependency. 3. go build fails: no required module provides package example.com/observer 4. Add require and replace to the same go.mod; Go can now find observer. 5. Run the new program: it prints observed: FindRoom, then room-42.</desc>
